name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Static checks only: no script in this repository is executed.
      - name: Bash syntax
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n
      - name: ShellCheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning --exclude=SC2034
